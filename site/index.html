<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Learning Studio — Interactive Concept Explorer</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <div class="brand-badge">V</div>
        <select id="courseSelect" class="course-select" aria-label="Select Interactive Course"></select>
      </div>

      <div class="topbar-actions">
        <div id="modeSwitcher" class="mode-switcher" role="group" aria-label="Example Mode">
          <button class="mode-btn active" data-mode="generic">Generic Blueprint</button>
          <button class="mode-btn" data-mode="casestudy">Sanitized Case Study</button>
        </div>
        <button id="globalResetBtn" class="btn btn-sm" title="Restart current lesson from Step 1">↺ Reset</button>
      </div>
    </div>
  </header>

  <div class="progress-bar-wrap">
    <div class="progress-meta">
      <span id="stepCounter">Step 1</span>
      <span id="modeIndicator">Mode: Generic Blueprint</span>
    </div>
    <div id="progressSegments" class="progress-segments"></div>
  </div>

  <main class="stage">
    <article id="lessonCard" class="lesson-card"></article>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
